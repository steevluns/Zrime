name: J7 Prime source baseline audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Audit Exynos7870-Revived LineageOS 19.1 source baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit
          report="audit/source-audit.md"
          {
            echo "# J7 Prime (on7xelte) source baseline audit"
            echo
            echo "This workflow checks the known LineageOS 19.1 reference sources. It does not build Android 16."
            echo
            for item in \
              "android_device_samsung_on7xelte lineage-19.1" \
              "android_device_samsung_universal7870-common lineage-19.1" \
              "android_vendor_samsung_on7xelte lineage-19.1" \
              "android_kernel_samsung_exynos7870 lineage-19.1"; do
              set -- $item
              name="$1"
              branch="$2"
              url="https://github.com/Exynos7870-Revived-Beta/$name.git"
              echo "## $name"
              if git ls-remote --exit-code --heads "$url" "refs/heads/$branch" >/tmp/ref.txt; then
                printf '%s\n' "- Found branch: `$branch`" "- Commit: `$(awk '{print $1}' /tmp/ref.txt)`"
              else
                echo "- MISSING: branch `$branch`"
              fi
              echo
            done
            echo "## Architecture and kernel checks"
            common="https://raw.githubusercontent.com/Exynos7870-Revived-Beta/android_device_samsung_universal7870-common/lineage-19.1/BoardConfigCommon.mk"
            device="https://raw.githubusercontent.com/Exynos7870-Revived-Beta/android_device_samsung_on7xelte/lineage-19.1/BoardConfig.mk"
            defconfig="https://raw.githubusercontent.com/Exynos7870-Revived-Beta/android_kernel_samsung_exynos7870/lineage-19.1/arch/arm64/configs/exynos7870-on7xelte_defconfig"
            curl -fsSL "$common" -o audit/BoardConfigCommon.mk
            curl -fsSL "$device" -o audit/BoardConfig.mk
            curl -fsSL "$defconfig" -o audit/exynos7870-on7xelte_defconfig
            grep -E 'TARGET_ARCH := arm64|TARGET_CPU_ABI := arm64-v8a|TARGET_2ND_ARCH := arm|TARGET_USES_64_BIT_BINDER := true|TARGET_LINUX_KERNEL_VERSION := 3.18' audit/BoardConfigCommon.mk || true
            grep -E 'TARGET_KERNEL_CONFIG := exynos7870-on7xelte_defconfig' audit/BoardConfig.mk || true
            grep -E 'CONFIG_ARM64=y|CONFIG_BOARD_ON7XELTE=y|CONFIG_CMDLINE=' audit/exynos7870-on7xelte_defconfig || true
            echo
            echo "## Android 16 readiness"
            echo "NOT VERIFIED. These sources are LineageOS 19.1 references. Android 16 porting, VNDK/HAL compatibility, SELinux enforcing, partition layout, recovery and on-device testing remain blocking work."
          } | tee "$report"
      - name: Upload source audit
        uses: actions/upload-artifact@v4
        with:
          name: on7xelte-source-baseline-audit
          path: audit/
